<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Catálogo Online</h1>
        <div class="form-cadastro">
            <input type="text" id="titulo" placeholder="Título">
            <input type="text" id="autor" placeholder="Autor">
            <input type="text" id="genero" placeholder="Gênero">
            <input type="text" id="ano" placeholder="Ano">
            <select name="Situação" id="situacao">
                <option value="">Situação</option>
                <option value="a comprar">A comprar</option>
                <option value="comprado">Comprado</option>
                <option value="lendo">Lendo</option>
                <option value="lido">Lido</option>
            </select>
            <button onclick="addBook()">Adicionar</button>
        </div>

        <div class="form-busca">
            <input type="text" id="termo-busca" placeholder="Buscar por Título, Autor, Gênero, Ano ou Situação">
            <button onclick="buscarLivro()">Busca</button>
        </div>

        <div id="catalogo"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
